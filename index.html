<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tes Reflek - Ultimate Edition</title>
    <style>
        :root { --neon: #00f2fe; --danger: #ff4757; --success: #2ed573; }
        body { 
            background: #121212; color: white; font-family: 'Segoe UI', sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; margin: 0; overflow: hidden;
        }
        h1 { font-size: 2.5rem; margin-bottom: 5px; text-shadow: 3px 3px 0px var(--danger); }
        
        /* Stats & Info */
        .top-bar { display: flex; gap: 15px; margin-bottom: 10px; }
        .stats-container {
            display: flex; gap: 20px; background: #222; padding: 10px 30px;
            border-radius: 50px; border: 1px solid #444; box-shadow: 0 0 15px rgba(0,0,0,0.5);
        }
        .stat-box { font-weight: bold; font-size: 0.9rem; }
        #goalVal { color: var(--success); } #timerVal { color: #ffbc00; }

        /* Arena dengan Animasi Level Up */
        #game-container {
            position: relative; width: 90vw; max-width: 650px; height: 400px;
            background: #1a1a1a; border: 3px solid #fff; border-radius: 20px;
            box-shadow: 0 0 20px var(--neon); overflow: hidden;
        }

        /* Animasi Flash Level Up */
        .level-up-flash {
            animation: flash 0.6s ease-out;
        }
        @keyframes flash {
            0% { background: var(--success); opacity: 0.8; }
            100% { background: #1a1a1a; opacity: 1; }
        }

        #target {
            position: absolute; width: 60px; height: 60px;
            background: radial-gradient(circle, var(--danger), #b33939);
            border-radius: 50%; box-shadow: 0 0 20px var(--danger);
            cursor: pointer; display: none; align-items: center; justify-content: center;
            font-size: 25px; user-select: none; z-index: 5;
        }

        /* Overlay & Leaderboard */
        #overlay {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 100; flex-direction: column; align-items: center; justify-content: center;
        }
        .modal { background: white; color: #333; padding: 25px; border-radius: 20px; text-align: center; width: 280px; }
        .highscore { margin-top: 10px; font-size: 0.8rem; color: #666; border-top: 1px solid #ddd; padding-top: 10px; }
        button { padding: 10px 20px; background: var(--danger); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 15px; }
    </style>
</head>
<body>

    <h1>Tes Reflek</h1>

    <div class="top-bar">
        <div class="stats-container">
            <div class="stat-box">Lvl: <span id="levelVal">1</span></div>
            <div class="stat-box">Goal: <span id="clicksLeft">5</span></div>
            <div class="stat-box">Skor: <span id="scoreVal">0</span></div>
            <div class="stat-box">Waktu: <span id="timerVal">30</span>s</div>
        </div>
    </div>
    
    <div id="game-container">
        <div id="target">🎯</div>
        
        <div id="overlay">
            <div class="modal">
                <h2 id="msgTitle">WAKTU HABIS!</h2>
                <p>Skor Akhir: <strong id="finalScore">0</strong></p>
                <div class="highscore">🏆 High Score: <span id="bestScore">0</span></div>
                <button onclick="startGame()">Main Lagi</button>
            </div>
        </div>
    </div>

    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const target = document.getElementById('target');
        const container = document.getElementById('game-container');
        const scoreDisplay = document.getElementById('scoreVal');
        const timerDisplay = document.getElementById('timerVal');
        const levelDisplay = document.getElementById('levelVal');
        const clicksLeftDisplay = document.getElementById('clicksLeft');

        let score = 0, level = 1, timeLeft = 30, gameActive = false, timerInterval;
        let clicksInLevel = 0;
        let clicksNeeded = 5; // Klik yang dibutuhkan untuk naik level

        // Tampilkan Highscore saat awal
        document.getElementById('bestScore').textContent = localStorage.getItem('reflekHighScore') || 0;

        function playSound(freq, type = 'triangle', duration = 0.1) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + duration);
        }

        function moveTarget() {
            const maxX = container.clientWidth - target.offsetWidth;
            const maxY = container.clientHeight - target.offsetHeight;
            target.style.left = Math.random() * maxX + 'px';
            target.style.top = Math.random() * maxY + 'px';
        }

        function levelUp() {
            level++;
            clicksInLevel = 0;
            clicksNeeded += 2; // Setiap level butuh 2 klik lebih banyak
            timeLeft += 5; // Bonus waktu setiap naik level!
            
            levelDisplay.textContent = level;
            
            // Animasi transisi level
            container.classList.add('level-up-flash');
            setTimeout(() => container.classList.remove('level-up-flash'), 600);
            
            // Suara level up (nada naik)
            playSound(800, 'square', 0.3);
            
            // Target makin kecil
            let size = Math.max(25, 60 - (level * 3));
            target.style.width = size + 'px';
            target.style.height = size + 'px';
        }

        function startGame() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            score = 0; level = 1; clicksInLevel = 0; clicksNeeded = 5; timeLeft = 30;
            gameActive = true;
            
            scoreDisplay.textContent = score;
            levelDisplay.textContent = level;
            clicksLeftDisplay.textContent = clicksNeeded;
            target.style.display = 'flex';
            document.getElementById('overlay').style.display = 'none';
            
            moveTarget();
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--;
                timerDisplay.textContent = timeLeft;
                if (timeLeft <= 0) endGame();
            }, 1000);
        }

        function endGame() {
            gameActive = false;
            clearInterval(timerInterval);
            target.style.display = 'none';
            
            // Simpan Highscore
            const hiScore = localStorage.getItem('reflekHighScore') || 0;
            if (score > hiScore) {
                localStorage.setItem('reflekHighScore', score);
                document.getElementById('msgTitle').textContent = "REKOR BARU!";
            } else {
                document.getElementById('msgTitle').textContent = "WAKTU HABIS!";
            }
            
            document.getElementById('overlay').style.display = 'flex';
            document.getElementById('finalScore').textContent = score;
            document.getElementById('bestScore').textContent = localStorage.getItem('reflekHighScore');
        }

        target.addEventListener('mousedown', () => {
            if (!gameActive) return;
            
            score++;
            clicksInLevel++;
            scoreDisplay.textContent = score;
            
            // Suara klik acak
            playSound(400 + Math.random() * 600);

            if (clicksInLevel >= clicksNeeded) {
                levelUp();
            }
            
            clicksLeftDisplay.textContent = clicksNeeded - clicksInLevel;
            moveTarget();
        });
    </script>
</body>
</html>
