<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade Clicker Pro</title>
    <style>
        /* Desain Background & Font */
        body { 
            background: linear-gradient(135deg, #1e1e2f, #2d3436);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        h1 { margin-bottom: 10px; text-shadow: 2px 2px #ff4757; }

        /* Panel Info (Skor & Waktu) */
        .stats-container {
            display: flex;
            gap: 40px;
            margin-bottom: 15px;
            background: rgba(255, 255, 255, 0.1);
            padding: 10px 30px;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(5px);
        }

        .stat-box { font-size: 20px; font-weight: bold; }
        #timerVal { color: #ffbc00; }
        #scoreVal { color: #2ed573; }

        /* Arena Game */
        #game-container {
            position: relative;
            width: 80vw;
            max-width: 600px;
            height: 400px;
            background: rgba(0, 0, 0, 0.3);
            border: 4px solid #fff;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            overflow: hidden;
            cursor: crosshair;
        }

        /* Objek Target dengan Animasi */
        #target {
            position: absolute;
            width: 50px;
            height: 50px;
            background: radial-gradient(circle, #ff4757, #ff6b81);
            border-radius: 50%; /* Jadi bulat biar lebih keren */
            box-shadow: 0 0 15px #ff4757;
            cursor: pointer;
            transition: transform 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            user-select: none;
        }

        #target:active { transform: scale(0.8); }

        /* Layar Game Over */
        #game-over {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            color: #333;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            z-index: 10;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            background: #ff4757;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>TARGET BLITZ</h1>

    <div class="stats-container">
        <div class="stat-box">Waktu: <span id="timerVal">30</span>s</div>
        <div class="stat-box">Skor: <span id="scoreVal">0</span></div>
    </div>
    
    <div id="game-container">
        <div id="target">🎯</div>
        
        <div id="game-over">
            <h2>WAKTU HABIS!</h2>
            <p>Skor Akhir Kamu: <span id="finalScore">0</span></p>
            <button onclick="resetGame()">Main Lagi</button>
        </div>
    </div>

    <script>
        const target = document.getElementById('target');
        const container = document.getElementById('game-container');
        const scoreDisplay = document.getElementById('scoreVal');
        const timerDisplay = document.getElementById('timerVal');
        const gameOverScreen = document.getElementById('game-over');
        const finalScoreDisplay = document.getElementById('finalScore');
        
        let score = 0;
        let timeLeft = 30;
        let gameActive = true;
        let timerInterval;

        function moveTarget() {
            const maxX = container.clientWidth - target.offsetWidth;
            const maxY = container.clientHeight - target.offsetHeight;

            const randomX = Math.floor(Math.random() * maxX);
            const randomY = Math.floor(Math.random() * maxY);

            target.style.left = randomX + 'px';
            target.style.top = randomY + 'px';
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                timeLeft--;
                timerDisplay.textContent = timeLeft;

                if (timeLeft <= 0) {
                    endGame();
                }
            }, 1000);
        }

        function endGame() {
            gameActive = false;
            clearInterval(timerInterval);
            target.style.display = 'none';
            gameOverScreen.style.display = 'block';
            finalScoreDisplay.textContent = score;
        }

        function resetGame() {
            score = 0;
            timeLeft = 30;
            gameActive = true;
            scoreDisplay.textContent = score;
            timerDisplay.textContent = timeLeft;
            gameOverScreen.style.display = 'none';
            target.style.display = 'flex';
            moveTarget();
            startTimer();
        }

        target.addEventListener('mousedown', () => {
            if (gameActive) {
                score++;
                scoreDisplay.textContent = score;
                moveTarget();
                
                // Efek visual kecil saat diklik
                target.style.background = '#2ed573';
                setTimeout(() => {
                    target.style.background = 'radial-gradient(circle, #ff4757, #ff6b81)';
                }, 100);
            }
        });

        // Inisialisasi
        moveTarget();
        startTimer();
    </script>
</body>
</html>
