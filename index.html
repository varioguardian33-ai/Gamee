<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tes Reflek - Sound Edition</title>
    <style>
        :root { --neon: #00f2fe; --danger: #ff4757; }
        body { 
            background: #121212; color: white; font-family: 'Segoe UI', sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; margin: 0;
        }
        h1 { font-size: 3rem; margin-bottom: 10px; text-shadow: 3px 3px 0px var(--danger); letter-spacing: 2px; }
        
        /* Kontrol & Statistik */
        .controls { margin-bottom: 15px; display: flex; gap: 10px; align-items: center; }
        select { padding: 5px; border-radius: 5px; background: #333; color: white; border: 1px solid var(--neon); }
        .stats-container {
            display: flex; gap: 30px; background: #222; padding: 10px 40px;
            border-radius: 50px; box-shadow: 0 0 15px rgba(0,0,0,0.5);
            margin-bottom: 20px; border: 1px solid #444;
        }
        #timerVal { color: #ffbc00; } #scoreVal { color: #2ed573; } #levelVal { color: var(--neon); }

        /* Arena */
        #game-container {
            position: relative; width: 90vw; max-width: 700px; height: 400px;
            background: #1a1a1a; border: 3px solid #fff; border-radius: 20px;
            box-shadow: 0 0 10px #fff, 0 0 20px var(--neon); overflow: hidden;
        }
        #target {
            position: absolute; width: 60px; height: 60px;
            background: radial-gradient(circle, var(--danger), #b33939);
            border-radius: 50%; box-shadow: 0 0 20px var(--danger);
            cursor: pointer; display: none; align-items: center; justify-content: center;
            font-size: 25px; user-select: none; transition: 0.1s;
        }

        /* Modal Game Over */
        #overlay {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 100; flex-direction: column; align-items: center; justify-content: center;
        }
        .modal { background: white; color: #333; padding: 30px; border-radius: 20px; text-align: center; }
        button { padding: 10px 20px; background: var(--danger); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <h1>Tes Reflek</h1>

    <div class="controls">
        <select id="timeSelect">
            <option value="15">15 Detik</option>
            <option value="30" selected>30 Detik</option>
        </select>
        <button id="startBtn" onclick="startGame()">Mulai!</button>
    </div>

    <div class="stats-container">
        <div class="stat-box">Waktu: <span id="timerVal">0</span>s</div>
        <div class="stat-box">Skor: <span id="scoreVal">0</span></div>
        <div class="stat-box">Level: <span id="levelVal">1</span></div>
    </div>
    
    <div id="game-container">
        <div id="target">🎯</div>
        <div id="overlay">
            <div class="modal">
                <h2>WAKTU HABIS!</h2>
                <p>Skor: <strong id="finalScore">0</strong> | Level: <strong id="finalLevel">1</strong></p>
                <button onclick="document.getElementById('overlay').style.display='none'">Tutup</button>
            </div>
        </div>
    </div>

    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const target = document.getElementById('target');
        const scoreDisplay = document.getElementById('scoreVal');
        const timerDisplay = document.getElementById('timerVal');
        const levelDisplay = document.getElementById('levelVal');

        let score = 0, level = 1, timeLeft = 30, gameActive = false, timerInterval;

        // FUNGSI SUARA RANDOM (Web Audio API)
        function playRandomSound() {
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            // Jenis suara (sine, square, triangle, sawtooth)
            oscillator.type = 'triangle'; 
            // Nada acak antara 400Hz sampai 1000Hz
            oscillator.frequency.setValueAtTime(400 + Math.random() * 600, audioCtx.currentTime);
            
            gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.1);

            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.1);
        }

        function moveTarget() {
            const maxX = document.getElementById('game-container').clientWidth - target.offsetWidth;
            const maxY = document.getElementById('game-container').clientHeight - target.offsetHeight;
            target.style.left = Math.random() * maxX + 'px';
            target.style.top = Math.random() * maxY + 'px';
        }

        function startGame() {
            if (gameActive) return;
            // Aktifkan Audio Context (syarat browser modern)
            if (audioCtx.state === 'suspended') audioCtx.resume();

            score = 0; level = 1; gameActive = true;
            timeLeft = parseInt(document.getElementById('timeSelect').value);
            
            scoreDisplay.textContent = score;
            levelDisplay.textContent = level;
            target.style.display = 'flex';
            document.getElementById('overlay').style.display = 'none';
            
            moveTarget();
            timerInterval = setInterval(() => {
                timeLeft--;
                timerDisplay.textContent = timeLeft;
                if (timeLeft <= 0) endGame();
            }, 1000);
        }

        function endGame() {
            gameActive = false;
            clearInterval(timerInterval);
            target.style.display = 'none';
            document.getElementById('overlay').style.display = 'flex';
            document.getElementById('finalScore').textContent = score;
            document.getElementById('finalLevel').textContent = level;
        }

        target.addEventListener('mousedown', () => {
            if (gameActive) {
                score++;
                scoreDisplay.textContent = score;
                playRandomSound(); // Panggil suara di sini
                
                // Mekanisme level (Target mengecil)
                level = Math.floor(score / 5) + 1;
                levelDisplay.textContent = level;
                let size = Math.max(20, 60 - (level * 3));
                target.style.width = size + 'px';
                target.style.height = size + 'px';

                moveTarget();
            }
        });
    </script>
</body>
</html>
